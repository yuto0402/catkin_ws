services:
  ros:
    image: catkin-ws-ros-desktop:local
    build: .
    working_dir: /catkin_ws
    volumes:
      - .:/catkin_ws
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    command: bash /catkin_ws/start-desktop.sh
    stdin_open: true
    tty: true
